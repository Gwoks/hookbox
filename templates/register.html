{% extends "base.html" %}

{% block title %}HookBox - Register{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-8">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">📦</div>
            <h1 class="text-2xl font-bold">Get Started with HookBox</h1>
            <p class="text-[#8b949e] mt-2">Enter your email to create your webhook space</p>
        </div>
        
        <div id="error-message" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 rounded text-red-200 text-sm"></div>
        <div id="success-message" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500 rounded text-green-200 text-sm"></div>
        
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="mb-6">
                <label class="block text-sm mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 focus:border-[#58a6ff] focus:outline-none"
                    placeholder="you@example.com">
            </div>
            
            <button type="submit" id="submit-btn" class="btn-primary w-full py-3 text-lg">
                Create Account
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-[#8b949e]">
            <p>Already have an account? <a href="/login" class="text-[#58a6ff] hover:underline">Sign in</a></p>
        </div>
    </div>
</div>

<script>
async function handleRegister(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating...';
    
    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        
        if (!response.ok) {
            const data = await response.json();
            errorDiv.textContent = 'Registration failed: ' + (data.detail || JSON.stringify(data));
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
            return;
        }
        
        const userData = await response.json();
        successDiv.textContent = 'Account created! Redirecting...';
        successDiv.classList.remove('hidden');
        
        localStorage.setItem('hookbox_user', JSON.stringify(userData));
        
        setTimeout(() => {
            window.location.href = '/';
        }, 500);
    } catch (err) {
        console.error('Registration error:', err);
        errorDiv.textContent = 'Network error: ' + err.message;
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
    }
}

// Check if already logged in
const stored = localStorage.getItem('hookbox_user');
if (stored) {
    window.location.href = '/';
}
</script>
{% endblock %}
