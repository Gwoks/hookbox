{% extends "base.html" %}

{% block title %}HookBox - Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-8">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">📦</div>
            <h1 class="text-2xl font-bold">Welcome to HookBox</h1>
            <p class="text-[#8b949e] mt-2">Sign in to access your webhooks</p>
        </div>
        
        <div id="error-message" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 rounded text-red-200 text-sm"></div>
        <div id="success-message" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500 rounded text-green-200 text-sm"></div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-6">
                <label class="block text-sm mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 focus:border-[#58a6ff] focus:outline-none"
                    placeholder="you@example.com">
            </div>
            
            <button type="submit" id="submit-btn" class="btn-primary w-full py-3 text-lg">
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-[#8b949e]">
            Don't have an account? <a href="/register" class="text-[#58a6ff] hover:underline">Register</a>
        </div>
    </div>
</div>

<script>
let userData = null;

async function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    
    console.log('Login with email:', email);
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        
        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Response data:', data);
        
        if (!response.ok) {
            errorDiv.textContent = 'Login failed: ' + (data.detail || JSON.stringify(data));
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
            return;
        }
        
        successDiv.textContent = 'Login successful! Redirecting...';
        successDiv.classList.remove('hidden');
        
        userData = data;
        localStorage.setItem('hookbox_user', JSON.stringify(userData));
        console.log('Stored user data:', userData);
        
        setTimeout(() => {
            window.location.href = '/';
        }, 500);
    } catch (err) {
        console.error('Login error:', err);
        errorDiv.textContent = 'Network error: ' + err.message;
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
    }
}

// Check if already logged in
const stored = localStorage.getItem('hookbox_user');
if (stored) {
    console.log('Already logged in, redirecting...');
    window.location.href = '/';
}
</script>
{% endblock %}
