{% extends "base.html" %}

{% block title %}HookBox - Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-8">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">📦</div>
            <h1 class="text-2xl font-bold">Welcome to HookBox</h1>
            <p class="text-[#8b949e] mt-2">Sign in to access your webhooks</p>
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-6">
                <label class="block text-sm mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 focus:border-[#58a6ff] focus:outline-none"
                    placeholder="you@example.com">
            </div>
            
            <button type="submit" class="btn-primary w-full py-3 text-lg">
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-[#8b949e]">
            Don't have an account? <a href="/register" class="text-[#58a6ff] hover:underline">Register</a>
        </div>
    </div>
</div>

<script>
let userData = null;

async function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        
        if (!response.ok) {
            const error = await response.json();
            alert(error.detail || 'Login failed');
            return;
        }
        
        userData = await response.json();
        localStorage.setItem('hookbox_user', JSON.stringify(userData));
        showToast('Login successful!');
        window.location.href = '/';
    } catch (err) {
        console.error('Login error:', err);
        alert('Login failed. Please try again.');
    }
}

// Check if already logged in
const stored = localStorage.getItem('hookbox_user');
if (stored) {
    window.location.href = '/';
}
</script>
{% endblock %}
