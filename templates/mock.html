{% extends "base.html" %}

{% block title %}HookBox - Mock Configuration{% endblock %}

{% block content %}
<div id="mock-config">
    <div class="flex items-center gap-2 text-sm text-[#8b949e] mb-4">
        <a href="/" class="hover:text-[#58a6ff]">Endpoints</a>
        <span>/</span>
        <a href="/d/${endpointId}" class="hover:text-[#58a6ff]">${endpointId}</a>
        <span>/</span>
        <span>Mock Configuration</span>
    </div>
</div>

<script>
const endpointId = window.location.pathname.split('/').pop();
let currentUser = null;
let mockRules = [];
let currentMethod = 'DEFAULT';

const HTTP_METHODS = ['DEFAULT', 'GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS', 'HEAD'];

async function init() {
    const stored = localStorage.getItem('hookbox_user');
    if (!stored) {
        window.location.href = '/login';
        return;
    }
    currentUser = JSON.parse(stored);
    await loadMockConfig();
}

async function loadMockConfig() {
    try {
        const epResponse = await fetch(`/api/endpoints/${endpointId}`, {
            headers: {
                'X-User-ID': currentUser.id,
                'X-Email': currentUser.email
            }
        });
        
        try {
            const mockResponse = await fetch(`/api/endpoints/${endpointId}/mock`, {
                headers: {
                    'X-User-ID': currentUser.id,
                    'X-Email': currentUser.email
                }
            });
            if (mockResponse.ok) {
                const data = await mockResponse.json();
                mockRules = data.rules || [];
            }
        } catch (e) {
            mockRules = [];
        }
        
        renderMockConfig();
    } catch (err) {
        console.error('Error loading mock config:', err);
        document.getElementById('mock-config').innerHTML = '<div class="text-red-500">Error loading configuration</div>';
    }
}

function getRuleForMethod(method) {
    return mockRules.find(r => r.method === method);
}

function renderMockConfig() {
    const container = document.getElementById('mock-config');
    const currentRule = getRuleForMethod(currentMethod);
    
    container.innerHTML = `
    <h1 class="text-2xl font-bold mb-1">Mock Configuration</h1>
    <p class="text-[#8b949e] mt-1 mb-6">Configure custom responses for ${endpointId}</p>
    
    <!-- Method Selector -->
    <div class="card p-4 mb-6">
        <label class="block text-sm mb-2">HTTP Method</label>
        <div class="flex flex-wrap gap-2">
            ${HTTP_METHODS.map(m => `
                <button onclick="selectMethod('${m}')" 
                    class="px-4 py-2 rounded ${currentMethod === m ? 'bg-[#238636] text-white' : 'bg-[#21262d] text-[#c9d1d9] hover:bg-[#30363d]'}">
                    ${m}
                </button>
            `).join('')}
        </div>
        <p class="text-xs text-[#8b949e] mt-2">
            ${currentMethod === 'DEFAULT' ? 'Default response when no method-specific rule matches' : `Response for ${currentMethod} requests`}
        </p>
    </div>
    
    <div class="card p-4 mb-6">
        <label class="text-sm text-[#8b949e] mb-2 block">Webhook URL</label>
        <div class="flex items-center gap-2">
            <code class="flex-1 bg-[#0d1117] p-3 rounded font-mono text-sm">${window.location.origin}/hook/${currentUser.id}/${endpointId}</code>
            <button onclick="copyToClipboard('${window.location.origin}/hook/${currentUser.id}/${endpointId}')" class="btn-secondary">Copy</button>
        </div>
    </div>
    
    <div class="card p-6">
        <form id="mock-form" onsubmit="saveMock(event)">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-[#30363d]">
                <div>
                    <label class="font-bold">Enable Response</label>
                    <p class="text-sm text-[#8b949e]">${currentMethod === 'DEFAULT' ? 'Use as fallback for all methods' : `Return this response for ${currentMethod} requests`}</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="mock-enabled" class="sr-only peer" ${currentRule?.enabled !== false ? 'checked' : ''}>
                    <div class="w-11 h-6 bg-[#30363d] rounded-full peer peer-checked:bg-[#238636] peer-focus:ring-2 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                </label>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm mb-2">Status Code</label>
                <input type="number" id="status-code" min="100" max="599" value="${currentRule?.status_code || 200}" class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 focus:border-[#58a6ff] focus:outline-none">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm mb-2">Content-Type</label>
                <select id="content-type" class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 focus:border-[#58a6ff] focus:outline-none">
                    <option value="application/json" ${(currentRule?.content_type || 'application/json') === 'application/json' ? 'selected' : ''}>application/json</option>
                    <option value="text/plain" ${currentRule?.content_type === 'text/plain' ? 'selected' : ''}>text/plain</option>
                    <option value="text/html" ${currentRule?.content_type === 'text/html' ? 'selected' : ''}>text/html</option>
                    <option value="application/xml" ${currentRule?.content_type === 'application/xml' ? 'selected' : ''}>application/xml</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm mb-2">Response Delay (ms)</label>
                <input type="number" id="delay-ms" min="0" max="30000" value="${currentRule?.delay_ms || 0}" class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 focus:border-[#58a6ff] focus:outline-none">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm mb-2">Custom Headers (JSON)</label>
                <textarea id="response-headers" rows="3" class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 font-mono text-sm focus:border-[#58a6ff] focus:outline-none">${currentRule?.response_headers ? JSON.stringify(currentRule.response_headers, null, 2) : '{}'}</textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm mb-2">Response Body</label>
                <textarea id="response-body" rows="10" class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-2 font-mono text-sm focus:border-[#58a6ff] focus:outline-none">${currentRule?.response_body || ''}</textarea>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="btn-primary">Save Configuration</button>
                <button type="button" onclick="deleteMockRule()" class="btn-danger">Delete Rule</button>
                <a href="/d/${endpointId}" class="btn-secondary">Back to Dashboard</a>
            </div>
        </form>
    </div>
    
    <!-- Existing Rules -->
    ${mockRules.length > 0 ? `
    <div class="card p-6 mt-6">
        <h2 class="font-bold mb-4">Configured Rules</h2>
        <div class="space-y-2">
            ${mockRules.map(r => `
                <div class="flex items-center justify-between bg-[#0d1117] p-3 rounded">
                    <div class="flex items-center gap-3">
                        <span class="px-2 py-1 rounded ${r.method === 'DEFAULT' ? 'bg-[#30363d]' : 'bg-[#238636]'} text-sm font-mono">${r.method}</span>
                        <span class="text-sm text-[#8b949e]">${r.status_code} - ${r.enabled ? 'Enabled' : 'Disabled'}</span>
                    </div>
                    <button onclick="selectMethod('${r.method}')" class="btn-secondary text-sm">Edit</button>
                </div>
            `).join('')}
        </div>
    </div>
    ` : ''}
    
    <div class="card p-6 mt-6">
        <h2 class="font-bold mb-4">Test Your Mock</h2>
        <p class="text-sm text-[#8b949e] mb-4">Send a test request to see your mock response.</p>
        <div class="flex gap-2">
            ${HTTP_METHODS.slice(1).map(m => `
                <button onclick="sendTestRequest('${m}')" class="btn-secondary">${m}</button>
            `).join('')}
        </div>
        <div id="test-result" class="mt-4 hidden"><h3 class="text-sm font-bold mb-2">Response:</h3><pre id="test-result-content" class="text-sm"></pre></div>
    </div>`;
}

function selectMethod(method) {
    currentMethod = method;
    renderMockConfig();
}

async function saveMock(event) {
    event.preventDefault();
    const enabled = document.getElementById('mock-enabled').checked;
    const statusCode = parseInt(document.getElementById('status-code').value);
    const contentType = document.getElementById('content-type').value;
    const delayMs = parseInt(document.getElementById('delay-ms').value);
    let responseHeaders = {};
    try { responseHeaders = JSON.parse(document.getElementById('response-headers').value || '{}'); } catch (e) { alert('Invalid JSON'); return; }
    const responseBody = document.getElementById('response-body').value;
    
    try {
        const response = await fetch(`/api/endpoints/${endpointId}/mock`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-User-ID': currentUser.id,
                'X-Email': currentUser.email
            },
            body: JSON.stringify({ 
                method: currentMethod,
                enabled, 
                status_code: statusCode, 
                content_type: contentType, 
                delay_ms: delayMs, 
                response_headers: responseHeaders, 
                response_body: responseBody 
            })
        });
        if (response.ok) { 
            showToast('Saved!'); 
            await loadMockConfig();
        } else { alert('Error'); }
    } catch (err) { console.error('Error:', err); alert('Error saving'); }
}

async function deleteMockRule() {
    if (!confirm('Delete this mock rule?')) return;
    // For now delete all - could be method-specific
    try {
        await fetch(`/api/endpoints/${endpointId}/mock`, {
            method: 'DELETE',
            headers: { 'X-User-ID': currentUser.id, 'X-Email': currentUser.email }
        });
        showToast('Deleted');
        mockRules = [];
        renderMockConfig();
    } catch (err) { console.error('Error:', err); }
}

async function sendTestRequest(method) {
    const resultDiv = document.getElementById('test-result');
    const contentDiv = document.getElementById('test-result-content');
    resultDiv.classList.remove('hidden');
    contentDiv.textContent = `Sending ${method}...`;
    
    try {
        const start = Date.now();
        const response = await fetch(`/hook/${currentUser.id}/${endpointId}`, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ test: true })
        });
        const elapsed = Date.now() - start;
        const body = await response.text();
        contentDiv.textContent = `${method} ${response.status} - ${elapsed}ms\n\n${body}`;
    } catch (err) { contentDiv.textContent = `Error: ${err.message}`; }
}

init();
</script>
{% endblock %}
