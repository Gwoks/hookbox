server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    root {{APP_DIR}}/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/healthz;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-lived socket: outlive nginx's 60s default between frames.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sse/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/sse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Event stream: no buffering, and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /e/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/e/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above the default MAX_INGEST_BODY_BYTES (1,000,000) so the app's own
        # 413 (not nginx's bare-HTML one) governs the mock ingest cap.
        client_max_body_size 2m;
    }
}
