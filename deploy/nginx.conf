server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    root {{APP_DIR}}/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The viewer page (F4): SPA fallback, but the share code lives in the path
    # (/s/<CODE>). Longer prefix than `location /` above, so nginx's
    # longest-prefix rule selects this one for the code itself; `access_log
    # off` keeps the code out of the access log the same way commit 47a267c
    # did for /ws/ and /sse/'s `?cap=`. This does NOT cover assets fetched
    # *after* the page loads (those fall through to `location /` and carry a
    # `Referer` instead) — that leak is closed by `index.html`'s
    # `<meta name="referrer" content="no-referrer">` plus the headers below.
    location /s/ {
        try_files $uri $uri/ /index.html;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/healthz;
        proxy_set_header Host $host;
    }

    # The public share resolver (F4): unauthenticated, and the share code is a
    # bearer credential in the URL path — same leak class as `?cap=` on /ws/
    # and /sse/ (commit 47a267c). Longer prefix than `location /api/` below,
    # so nginx's longest-prefix rule selects this one. `X-Real-IP` MUST stay:
    # the public resolver's per-IP rate limiter only trusts it from a loopback
    # peer, which nginx always is (backend/src/routes/api.rs:273-299).
    location /api/share/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/api/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-lived socket: outlive nginx's 60s default between frames.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # The feed/tunnel handshake carries the owner secret in `?cap=`
        # (browsers can't set a custom Authorization header on a WS/SSE
        # handshake); don't let the request line — query string included —
        # land in the access log.
        access_log off;
    }

    location /sse/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/sse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Event stream: no buffering, and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Same ?cap= exposure as /ws/ above.
        access_log off;
    }

    location /e/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/e/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above the default MAX_INGEST_BODY_BYTES (1,000,000) so the app's own
        # 413 (not nginx's bare-HTML one) governs the mock ingest cap.
        client_max_body_size 2m;
    }
}
