# HookBox deployment — a SINGLE app container (Rust binary + SQLite). The Rust
# re-platform collapses all four Redis responsibilities into in-process
# structures + SQLite (arch §Approach), so there is no Redis/Postgres service.
#
#   docker compose up           # builds + starts the single app container
#   docker compose down         # stops; the named volume PERSISTS the SQLite DB
#   docker compose down -v      # ALSO wipes the volume (fresh DB)
#
# All knobs are env-overridable; `.env` in this directory is auto-loaded.

services:
  app:
    build: .
    environment:
      # --- durable store (one WAL SQLite file on the named volume) -----------
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/app.db}
      STATIC_DIR: ${STATIC_DIR:-/app/dist}
      # --- routing (LOCKED §2; OQ-4 default port 8080) -----------------------
      # APP_PORT is NOT set here on purpose: the container's internal listen
      # port stays fixed at 8080 (Dockerfile ENV/EXPOSE/HEALTHCHECK all
      # assume it). Relocate the published port via the host side of the
      # `ports:` mapping below instead — setting APP_PORT here would move the
      # binary's listen port out from under that fixed container-side mapping.
      MOCK_DOMAIN: ${MOCK_DOMAIN:-mock.local}
      APP_HOST: ${APP_HOST:-localhost}
      APP_BIND_HOST: ${APP_BIND_HOST:-0.0.0.0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # --- retention (LOCKED §5.6) -------------------------------------------
      TRACE_CAP: ${TRACE_CAP:-100}
      TRACE_TTL_HOURS: ${TRACE_TTL_HOURS:-24}
      RETENTION_SWEEP_SECONDS: ${RETENTION_SWEEP_SECONDS:-300}
      GONE_TTL_HOURS: ${GONE_TTL_HOURS:-168}
      # --- MITM / SSRF policy (AC-28..32, AC-S1..S4) -------------------------
      MITM_TIMEOUT_S: ${MITM_TIMEOUT_S:-10}
      MITM_MAX_BODY_BYTES: ${MITM_MAX_BODY_BYTES:-5000000}
      MITM_ALLOW_PRIVATE: ${MITM_ALLOW_PRIVATE:-false}
      # --- simulated-condition + ingest bounds (AC-37/39, AC-S18) ------------
      LATENCY_MAX_MS: ${LATENCY_MAX_MS:-10000}
      RATE_LIMIT_MAX_PER_MIN: ${RATE_LIMIT_MAX_PER_MIN:-100000}
      MAX_INGEST_BODY_BYTES: ${MAX_INGEST_BODY_BYTES:-1000000}
    ports:
      # host:container — the container always listens on 8080 (see the note
      # above); change the host side to relocate the published port.
      - "${APP_PORT:-8080}:8080"
    volumes:
      - hookbox_data:/app/data
    restart: unless-stopped

# Named volume: the SQLite DB (config/rules/history/state/collections) survives
# `docker compose down && up` (without -v).
volumes:
  hookbox_data:
